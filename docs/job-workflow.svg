<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<title>Job workflow between Operator, Planner and Technician (corrected)</title>
<desc>The operator adds a job, visible to both planner and technician. Either the planner assigns it (tech + planned + due date), or a technician self-picks a high-priority job when the planner is busy. The technician works; a Hold (with a reason) goes to the planner to follow up and set a due date, then resumes. When complete and signed, the operator approves (Done) or rejects (Rework back to the technician).</desc>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/></marker>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#DC2626"/></marker>
  <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16A34A"/></marker>
</defs>
<rect x="0" y="0" width="820" height="660" fill="#FFFFFF"/>

<text x="20" y="24" font-size="16" font-weight="800" fill="#0F2850">Job workflow &#183; Operator &#183; Planner &#183; Technician</text>
<g font-size="12" font-weight="700">
  <circle cx="26" cy="44" r="6" fill="#E8590C"/><text x="38" y="48" fill="#475569">Operator</text>
  <circle cx="132" cy="44" r="6" fill="#2563EB"/><text x="144" y="48" fill="#475569">Planner</text>
  <circle cx="230" cy="44" r="6" fill="#059669"/><text x="242" y="48" fill="#475569">Technician</text>
</g>

<!-- S1 Operator -->
<rect x="250" y="58" width="320" height="52" rx="12" fill="#FFF7ED" stroke="#E8590C" stroke-width="1.4"/>
<rect x="250" y="58" width="6" height="52" rx="3" fill="#E8590C"/>
<text x="270" y="82" font-size="14" font-weight="800" fill="#0F2850">&#9312; OPERATOR adds a job</text>
<text x="270" y="101" font-size="11.5" fill="#475569">Reported &#8212; visible to planner &amp; technician</text>

<!-- fork -->
<path d="M330,110 V128 H210 V144" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M490,110 V128 H610 V144" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

<!-- S2a Planner assigns -->
<rect x="40" y="146" width="340" height="66" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="40" y="146" width="6" height="66" rx="3" fill="#2563EB"/>
<text x="60" y="170" font-size="14" font-weight="800" fill="#0F2850">&#9313;a PLANNER assigns</text>
<text x="60" y="189" font-size="11.5" fill="#475569">technician + planned date + due date</text>
<text x="60" y="205" font-size="11.5" font-weight="700" fill="#2563EB">&#8594; Released</text>

<!-- S2b Tech self-pick -->
<rect x="440" y="146" width="340" height="66" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="440" y="146" width="6" height="66" rx="3" fill="#059669"/>
<text x="460" y="170" font-size="14" font-weight="800" fill="#0F2850">&#9313;b or TECH self-picks</text>
<text x="460" y="189" font-size="11.5" fill="#475569">high-priority job if the planner is busy</text>
<text x="460" y="205" font-size="11.5" font-weight="700" fill="#059669">&#8594; claims &amp; starts it</text>

<!-- merge to S3 -->
<path d="M210,212 V236 H360 V254" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M610,212 V236 H460 V254" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

<!-- S3 Tech works -->
<rect x="250" y="256" width="320" height="52" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<rect x="250" y="256" width="6" height="52" rx="3" fill="#059669"/>
<text x="270" y="280" font-size="14" font-weight="800" fill="#0F2850">&#9314; TECHNICIAN works</text>
<text x="270" y="299" font-size="11.5" fill="#475569">Start &#8594; In progress</text>

<!-- Hold side box (Planner) -->
<rect x="600" y="322" width="210" height="70" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="600" y="322" width="6" height="70" rx="3" fill="#2563EB"/>
<text x="618" y="346" font-size="13" font-weight="800" fill="#0F2850">HOLD &#8594; PLANNER</text>
<text x="618" y="364" font-size="11" fill="#475569">follows up the reason,</text>
<text x="618" y="380" font-size="11" fill="#475569">sets a due date, then resumes</text>
<path d="M570,290 H705 V320" fill="none" stroke="#DC2626" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="600" y="284" font-size="10.5" font-weight="700" fill="#DC2626">Hold + reason</text>
<path d="M600,378 H460 V310" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="470" y="336" font-size="10.5" font-weight="700" fill="#2563EB">resume</text>

<!-- S3 -> S4 -->
<line x1="360" y1="308" x2="360" y2="348" stroke="#64748B" stroke-width="1.6" marker-end="url(#a)"/>
<text x="370" y="332" font-size="11" font-weight="700" fill="#059669">completes</text>

<!-- S4 Tech complete -->
<rect x="250" y="350" width="320" height="52" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<rect x="250" y="350" width="6" height="52" rx="3" fill="#059669"/>
<text x="270" y="374" font-size="14" font-weight="800" fill="#0F2850">&#9315; TECHNICIAN completes + signs</text>
<text x="270" y="393" font-size="11.5" fill="#475569">&#8594; Completed &#183; awaiting approval</text>

<!-- S4 -> S5 -->
<line x1="360" y1="402" x2="360" y2="438" stroke="#64748B" stroke-width="1.6" marker-end="url(#a)"/>

<!-- S5 Operator approve -->
<rect x="250" y="440" width="320" height="52" rx="12" fill="#FFF7ED" stroke="#E8590C" stroke-width="1.4"/>
<rect x="250" y="440" width="6" height="52" rx="3" fill="#E8590C"/>
<text x="270" y="464" font-size="14" font-weight="800" fill="#0F2850">&#9316; OPERATOR reviews</text>
<text x="270" y="483" font-size="11.5" fill="#475569">Approve (signature)  &#8226;  or  Reject (reason)</text>

<!-- approve -> done -->
<line x1="360" y1="492" x2="360" y2="528" stroke="#16A34A" stroke-width="1.8" marker-end="url(#ag)"/>
<text x="370" y="514" font-size="11" font-weight="700" fill="#16A34A">approve + sign</text>

<!-- S6 done -->
<rect x="250" y="530" width="220" height="44" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
<text x="360" y="558" text-anchor="middle" font-size="14" font-weight="800" fill="#065F46">&#10003; DONE &#8212; closed</text>

<!-- reject -> rework back to S3 -->
<path d="M250,466 H30 V282 H248" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="35" y="378" font-size="11" font-weight="700" fill="#DC2626" transform="rotate(-90 35 378)">reject + reason &#8594; Rework</text>
</svg>
