<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1760" viewBox="0 0 1000 1760" role="img" aria-labelledby="title desc">
  <title id="title">Operator maintenance workflow</title>
  <desc id="desc">The workflow from operator reporting a machine problem through technician repair and operator approval or rework.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#35607F"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#163A59}.sub{font:18px Arial,sans-serif;fill:#55738B}.box{stroke:#35607F;stroke-width:2}.t{font:600 21px Arial,sans-serif;fill:#163A59;text-anchor:middle}.small{font:18px Arial,sans-serif;fill:#163A59;text-anchor:middle}.label{font:700 18px Arial,sans-serif;fill:#35607F;text-anchor:middle}.line{stroke:#35607F;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="1760" fill="#F5F9FC"/>
  <text class="title" x="500" y="55" text-anchor="middle">Operator Workflow — CMMS</text>
  <text class="sub" x="500" y="88" text-anchor="middle">From reporting a machine problem to verified completion</text>

  <rect class="box" x="270" y="125" width="460" height="75" rx="18" fill="#DCEEF9"/><text class="t" x="500" y="171">1. Operator finds a machine problem</text>
  <path class="line" d="M500 200 V242"/>
  <rect class="box" x="270" y="245" width="460" height="75" rx="18" fill="#DCEEF9"/><text class="t" x="500" y="291">2. Open CMMS and scan/select machine</text>
  <path class="line" d="M500 320 V370"/>

  <path d="M500 370 L650 440 L500 510 L350 440 Z" fill="#FFF3D6" stroke="#B57700" stroke-width="2"/>
  <text class="t" x="500" y="433">Machine stopped?</text><text class="small" x="500" y="460">Is it a breakdown?</text>
  <text class="label" x="305" y="430">Yes</text><text class="label" x="695" y="430">No</text>

  <path class="line" d="M350 440 H145 V560"/>
  <rect class="box" x="55" y="560" width="340" height="95" rx="18" fill="#FCE2E2"/><text class="t" x="225" y="600">3A. Report urgent breakdown</text><text class="small" x="225" y="629">All technicians are notified</text>
  <path class="line" d="M225 655 V735 H500"/>

  <path class="line" d="M650 440 H855 V560"/>
  <rect class="box" x="605" y="560" width="340" height="95" rx="18" fill="#E6F2E9"/><text class="t" x="775" y="600">3B. Report normal issue</text><text class="small" x="775" y="629">Planner assigns a technician</text>
  <path class="line" d="M775 655 V735 H500"/>

  <rect class="box" x="270" y="735" width="460" height="80" rx="18" fill="#E5EDF7"/><text class="t" x="500" y="782">4. Technician starts the job</text>
  <path class="line" d="M500 815 V855"/>
  <rect class="box" x="270" y="855" width="460" height="80" rx="18" fill="#E5EDF7"/><text class="t" x="500" y="902">5. Timer starts automatically</text>
  <path class="line" d="M500 935 V980"/>

  <path d="M500 980 L650 1050 L500 1120 L350 1050 Z" fill="#FFF3D6" stroke="#B57700" stroke-width="2"/>
  <text class="t" x="500" y="1058">Work interrupted?</text>
  <text class="label" x="305" y="1040">Yes</text><text class="label" x="695" y="1040">No</text>
  <path class="line" d="M350 1050 H125 V1160"/>
  <rect class="box" x="35" y="1160" width="350" height="110" rx="18" fill="#FFF3D6"/><text class="t" x="210" y="1202">Pause with reason</text><text class="small" x="210" y="1232">Waiting for parts · production</text><text class="small" x="210" y="1257">break · other interruption</text>
  <path class="line" d="M210 1270 V1320 H500 V935"/>

  <path class="line" d="M650 1050 H790 V1160"/>
  <rect class="box" x="555" y="1160" width="400" height="110" rx="18" fill="#E6F2E9"/><text class="t" x="755" y="1202">6. Technician completes repair</text><text class="small" x="755" y="1232">Problem · root cause · solution</text><text class="small" x="755" y="1257">Fault codes · photos</text>
  <path class="line" d="M755 1270 V1340 H500"/>

  <rect class="box" x="270" y="1340" width="460" height="78" rx="18" fill="#E5EDF7"/><text class="t" x="500" y="1385">7. Operator receives completion notice</text>
  <path class="line" d="M500 1418 V1460"/>
  <path d="M500 1460 L650 1530 L500 1600 L350 1530 Z" fill="#FFF3D6" stroke="#B57700" stroke-width="2"/>
  <text class="t" x="500" y="1524">Operator checks machine</text><text class="small" x="500" y="1551">Working correctly?</text>
  <text class="label" x="300" y="1518">No</text><text class="label" x="700" y="1518">Yes</text>
  <path class="line" d="M350 1530 H150 V1650"/>
  <rect class="box" x="35" y="1650" width="300" height="78" rx="18" fill="#FCE2E2"/><text class="t" x="185" y="1681">Reject with reason</text><text class="small" x="185" y="1710">Job returns for rework</text>
  <path class="line" d="M650 1530 H850 V1650"/>
  <rect class="box" x="665" y="1650" width="300" height="78" rx="18" fill="#D9F0E0"/><text class="t" x="815" y="1681">Approve and sign</text><text class="small" x="815" y="1710">Job is Done</text>
</svg>
