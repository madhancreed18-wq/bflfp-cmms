<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lot Dashboard</title>
<style>
:root{--ink:#1E293B;--ink2:#475569;--mut:#64748B;--line:#E2E8F0;--blue:#1B75BC;--orange:#F97316}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#E4E9F1 0%,#F1F5F9 360px) no-repeat #F1F5F9;color:var(--ink);font:14px/1.45 "Sarabun",system-ui,"Segoe UI",Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:18px 20px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:4px}.top img{height:42px}
h1{font-size:20px;margin:0;font-weight:700}h1 small,h2 small{font-size:.82em;color:var(--mut);font-weight:600}
.lead{color:var(--mut);font-size:13px;margin:0 0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.04);min-width:0}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.filters{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.f label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}.f label small{color:var(--mut)}
.in{height:40px;border:1px solid #CBD5E1;border-radius:8px;padding:0 10px;background:#fff;font-size:14px}
.btn{height:40px;border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:0 14px;font-size:14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:40px;border:1px solid #CBD5E1;background:#fff;border-radius:999px;padding:0 14px;font-size:14px;cursor:pointer;white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
.chip.on{background:#0F172A;border-color:#0F172A;color:#fff;font-weight:700}
.asof{margin-left:auto;height:32px;display:inline-flex;align-items:center;background:#DBEAFE;color:#1E3A8A;border-radius:999px;padding:0 12px;font-size:12.5px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:12px 0}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid;border-radius:10px;padding:12px 14px}
.kpi .k{font-size:13px;color:var(--ink2)}.kpi .k small{color:var(--mut)}.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}.kpi .s{font-size:11.5px;color:var(--mut)}
.row{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:1000px){.row{grid-template-columns:1fr}}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 16px;font-size:13px}.info div span{display:block;color:var(--mut);font-size:12px}.info b{font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:12px;color:var(--ink2);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#F8FAFC}
th small{color:var(--mut);font-weight:500}
td{padding:8px;border-bottom:1px solid #F1F3F6;font-variant-numeric:tabular-nums}
.n{text-align:right}.mono{font-family:ui-monospace,Consolas,monospace}.nw{white-space:nowrap}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px}
.p-ok{background:#DCFCE7;color:#166534}.p-w{background:#FEF3C7;color:#92400E}.p-fg{background:#DBEAFE;color:#1E3A8A}.p-r{background:#FEE2E2;color:#991B1B}
.mbar{display:flex;align-items:center;gap:10px;margin:8px 0}.mbar .nm{width:170px;font-weight:600;font-size:13px}
.mbar .tr{flex:1;height:22px;background:#F1F5F9;border-radius:4px;position:relative}.mbar .tr i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--blue)}
.mbar .vl{width:250px;white-space:nowrap;font-size:12.5px;color:var(--ink2)}.mbar .vl b{color:var(--ink);font-size:14px}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.foot{font-size:12px;color:var(--mut);margin-top:8px}
.tw{max-height:420px;overflow:auto}
#tip{position:fixed;pointer-events:none;background:#1E293B;color:#fff;font-size:12.5px;padding:6px 10px;border-radius:8px;display:none;z-index:9;white-space:nowrap}
</style></head><body><div class="wrap">
