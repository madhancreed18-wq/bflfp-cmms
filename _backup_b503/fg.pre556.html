<body>
<header class="top">
  <div class="brand"><span style="background:#fff;border-radius:9px;padding:4px 7px;display:flex"><img src="/logo.png?v=2" alt="Bluefalo" style="height:24px;display:block"></span><span id="appName">FG Stock</span> <span id="fac" style="color:var(--orange)"></span></div>

/* ════════ Type-ahead: a drop-down of matches while typing ════════
   ta(input, source, onPick) — source(q) returns [{v,t,s}] (value, title, sub), sync or async. */
function ta(inp,source,onPick,min){
  if(!inp||inp._ta)return;inp._ta=1;inp.setAttribute('autocomplete','off');min=min==null?1:min;
  let box=null,items=[],hi=-1,tm=null;
  const close=()=>{if(box){box.remove();box=null;}hi=-1;};
  const pick=i=>{const it=items[i];if(!it)return;inp.value=it.v;close();if(onPick)onPick(it);inp.dispatchEvent(new Event('input'));inp.dispatchEvent(new Event('change'));};
  const draw=()=>{
    if(!items.length){close();return;}
    if(!box){box=document.createElement('div');box.className='tadd';document.body.appendChild(box);}
    const r=inp.getBoundingClientRect();box.style.left=r.left+'px';box.style.top=(r.bottom+2)+'px';box.style.width=Math.max(r.width,280)+'px';
    box.innerHTML=items.map((it,i)=>`<div class="tadi ${i===hi?'on':''}" data-i="${i}"><b>${esc(it.t)}</b>${it.s?`<span>${esc(it.s)}</span>`:''}</div>`).join('');
    box.querySelectorAll('.tadi').forEach(d=>d.onmousedown=e=>{e.preventDefault();pick(+d.dataset.i);});
  };
  const run=async()=>{const q=inp.value.trim();if(q.length<min){close();return;}
    let r=source(q);if(r&&r.then)r=await r;if(inp.value.trim()!==q)return;items=(r||[]).slice(0,14);hi=-1;draw();};
  inp.addEventListener('input',e=>{if(e.isTrusted===false&&!box)return;clearTimeout(tm);tm=setTimeout(run,150);});
  inp.addEventListener('focus',()=>{if(inp.value.trim().length>=min)run();});
  inp.addEventListener('blur',()=>setTimeout(close,120));
  inp.addEventListener('keydown',e=>{if(!box)return;
    if(e.key==='ArrowDown'){hi=Math.min(items.length-1,hi+1);draw();e.preventDefault();}
    else if(e.key==='ArrowUp'){hi=Math.max(0,hi-1);draw();e.preventDefault();}
    else if(e.key==='Enter'&&hi>=0){pick(hi);e.preventDefault();e.stopPropagation();}
    else if(e.key==='Escape')close();});
  window.addEventListener('scroll',close,true);
}
const taProdName=q=>{q=q.toLowerCase();return (PRODS||[]).filter(p=>(p.name+' '+p.code).toLowerCase().includes(q))

  for(const r of rows()){for(const k of keys){const v=String(r[k]||'');if(v&&v.toLowerCase().includes(q)&&!seen.has(v)){seen.add(v);out.push({v,t:v,s:k==='product_id'||k==='product_code'?(r.product_name||''):(k==='lot_no'?(r.product_id||r.product_code||''):'')});if(out.length>=12)return out;}}}return out;};

/* ════════ QR scanner: camera (BarcodeDetector → jsQR), photo, or typed/handheld ════════ */
let SC={stream:null,t:null,det:null,cv:null,cand:null,cb:null,busy:false};
function loadJs(src,test){return new Promise((res,rej)=>{if(test())return res();const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);});}
async function detector(){
  if(!('BarcodeDetector' in window))return null;
  try{const f=BarcodeDetector.getSupportedFormats?await BarcodeDetector.getSupportedFormats():['qr_code'];
    return f.includes('qr_code')?new BarcodeDetector({formats:['qr_code']}):null;}catch(e){return null;}
}
async function readQR(cv){
  if(SC.det){try{const c=await SC.det.detect(cv);return c&&c.length?c[0].rawValue:null;}catch(e){SC.det=null;}}
  try{await loadJs('/vendor/jsqr.js',()=>window.jsQR);}catch(e){return null;}
  const im=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,cv.width,cv.height);
  const r=window.jsQR(im.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});return r&&r.data?r.data:null;
}
async function openScan(title,cb){
  SC.cb=cb;SC.cand=null;
  const ov=document.createElement('div');ov.className='scan';ov.id='scan';
  ov.innerHTML=`<video id="scv" playsinline autoplay muted></video><div class="fr" id="scf"></div>
   <div class="hint" id="sch">${esc(title)}<br><small>${L('เล็ง QR ให้อยู่ในกรอบ ถือนิ่ง ๆ','Hold the QR inside the frame')}</small></div>
   <div class="bt"><label class="btn" style="text-align:center">${L('ถ่ายรูป QR แทน','Take a photo instead')}<input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanPhoto(this)"></label>
   <button class="btn" onclick="stopScan()">${L('ยกเลิก','Cancel')}</button></div>`;
  document.body.appendChild(ov);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#sch').textContent=L('เปิดกล้องสดไม่ได้ — ใช้ถ่ายรูปแทน','No live camera here — use the photo button');return;}
  try{SC.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});}
  catch(e){$('#sch').textContent=L('เปิดกล้องไม่ได้ — อนุญาตกล้อง หรือใช้ถ่ายรูปแทน','Cannot open the camera — allow it, or use the photo button');return;}
  if(!$('#scan')){stopScan();return;}
  const v=$('#scv');v.srcObject=SC.stream;try{await v.play()}catch(e){}
  SC.det=await detector();SC.cv=document.createElement('canvas');tick();
}
async function tick(){
  const v=$('#scv');if(!v||!$('#scan'))return;
  if(!SC.busy&&v.videoWidth){SC.busy=true;
    try{const vw=v.videoWidth,vh=v.videoHeight,s=Math.min(vw,vh)*.75,k=Math.min(1,560/s);
      SC.cv.width=SC.cv.height=Math.round(s*k);
      SC.cv.getContext('2d',{willReadFrequently:true}).drawImage(v,(vw-s)/2,(vh-s)/2,s,s,0,0,SC.cv.width,SC.cv.height);
      const raw=await readQR(SC.cv);
      if(raw){if(!SC.cand||SC.cand.raw!==raw)SC.cand={raw,t:Date.now()};$('#scf')&&$('#scf').classList.add('lock');
        if(Date.now()-SC.cand.t>350){SC.busy=false;return scanned(raw);}}
    }catch(e){}
    SC.busy=false;}
  SC.t=setTimeout(tick,140);
}
async function scanPhoto(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  try{const img=new Image();img.src=URL.createObjectURL(f);await img.decode();
    for(const z of [.5,.8,1]){const W=img.width,H=img.height,sw=W*z,sh=H*z,k=Math.min(1,1600/Math.max(sw,sh));
      const cv=document.createElement('canvas');cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
      cv.getContext('2d').drawImage(img,(W-sw)/2,(H-sh)/2,sw,sh,0,0,cv.width,cv.height);
      if(!SC.det&&!window.jsQR)SC.det=await detector();
      const raw=await readQR(cv);if(raw)return scanned(raw);}
    $('#sch').textContent=L('อ่าน QR จากรูปไม่ได้ ลองใหม่','No QR found in the photo — try again');
  }catch(e){}
}
function scanned(raw){const cb=SC.cb;stopScan();if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){};if(cb)cb(raw);}
function stopScan(){clearTimeout(SC.t);if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null;}const o=$('#scan');if(o)o.remove();}

     onkeydown="if(event.key==='Enter'){const v=this.value;this.value='';${fn}(v)}"></div>`;
}

  let t=$('#vtip');if(!t){t=document.createElement('div');t.id='vtip';t.style.cssText='position:fixed;z-index:40;pointer-events:none;background:#202020;color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;max-width:260px;line-height:1.35';document.body.appendChild(t);}
  root.addEventListener('mousemove',e=>{const m=e.target.closest('[data-tip]');if(!m){t.style.display='none';return;}t.innerHTML=m.getAttribute('data-tip');t.style.display='block';
    const x=Math.min(e.clientX+14,innerWidth-t.offsetWidth-8),y=Math.max(8,e.clientY-t.offsetHeight-12);t.style.left=x+'px';t.style.top=y+'px';});
  root.addEventListener('mouseleave',()=>t.style.display='none');
  root.addEventListener('click',e=>{const m=e.target.closest('[data-tip]');if(m&&matchMedia('(hover:none)').matches){t.innerHTML=m.getAttribute('data-tip');t.style.display='block';t.style.left='12px';t.style.top=(e.clientY-60)+'px';}});
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
/* grouped columns: receive vs release per day / month */
function colChart(el,rows,monthly){
  const W=Math.max(300,el.clientWidth),H=250,P={l:52,r:8,t:10,b:34},iw=W-P.l-P.r,ih=H-P.t-P.b;
  const mx=niceMax(Math.max(...rows.map(r=>Math.max(r.in,r.out)),1)),n=rows.length,slot=iw/n,bw=Math.max(1.5,Math.min(18,(slot-2)/2-1));
  const y=v=>P.t+ih-(v/mx)*ih,ticks=[0,.25,.5,.75,1].map(f=>f*mx);
  const lab=r=>monthly?['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][+r.k.slice(5,7)-1]+' '+r.k.slice(2,4):r.k.slice(8,10)+'/'+r.k.slice(5,7);
  const every=Math.ceil(n/(W<560?6:12));
  const bar=(x,v,c)=>{const h=Math.max(0,P.t+ih-y(v));if(h<=0)return '';const r=Math.min(3,bw/2,h);return `<path d="M${x},${P.t+ih}V${P.t+ih-h+r}q0,-${r} ${r},-${r}h${bw-2*r}q${r},0 ${r},${r}V${P.t+ih}Z" fill="${c}"/>`;};
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="${L('รับเข้าและจ่ายออกต่อช่วงเวลา','receive and release over time')}" style="display:block">`;
  ticks.forEach(t=>{s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="${VZ.grid}" stroke-width="1"/><text x="${P.l-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="${VZ.ink2}">${kgT(t)}</text>`;});
  rows.forEach((r,i)=>{const x0=P.l+i*slot+(slot-(2*bw+2))/2;
    s+=`<g data-tip="<b>${monthly?esc(lab(r)):fmtD(r.k)}</b><br><span style='color:#93c5fd'>■</span> ${L('รับเข้า','Received')} ${kgT(r.in)}<br><span style='color:#fdba74'>■</span> ${L('จ่ายออก','Released')} ${kgT(r.out)}">
      <rect x="${P.l+i*slot}" y="${P.t}" width="${slot}" height="${ih}" fill="transparent"/>${bar(x0,r.in,VZ.in)}${bar(x0+bw+2,r.out,VZ.out)}</g>`;
    if(i%every===0||i===n-1)s+=`<text x="${P.l+i*slot+slot/2}" y="${H-P.b+16}" text-anchor="middle" font-size="11" fill="${VZ.ink2}">${esc(lab(r))}</text>`;});
  s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${P.t+ih}" y2="${P.t+ih}" stroke="#94A3B8"/></svg>`;
  el.innerHTML=s;
}
/* horizontal bars (single hue, or sequential steps when ordered) */
function hBars(el,rows,opt){
  opt=opt||{};const tot=rows.reduce((a,r)=>a+r[1],0)||1,mx=Math.max(...rows.map(r=>r[1]),1);
  el.innerHTML=rows.length?rows.map((r,i)=>{const c=opt.seq?VZ.seq[Math.min(i,VZ.seq.length-1)]:(opt.color||VZ.in),pc=Math.round(100*r[1]/tot);
    return `<div data-tip="<b>${esc(r[0])}</b><br>${kgT(r[1])} · ${pc}%" style="display:grid;grid-template-columns:minmax(70px,34%) 1fr auto;gap:8px;align-items:center;padding:4px 0">
     <span style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r[0])}</span>
     <span style="height:14px;background:#F1F5F9;border-radius:4px;overflow:hidden"><span style="display:block;height:14px;width:${Math.max(1,100*r[1]/mx)}%;background:${c};border-radius:0 4px 4px 0"></span></span>
     <span style="font-size:12.5px;color:#0F172A;font-weight:600;min-width:64px;text-align:right">${kgT(r[1])}</span></div>`;}).join(''):`<div class="muted">${L('ไม่มีข้อมูล','No data')}</div>`;
}

function ckSet(id,v){CK[id]=Object.assign(CK[id]||{},{v});if(v==='ok')CK[id].note='';CKRENDER();if(v==='ng')setTimeout(()=>{const i=$('#ck-'+id+' input');if(i)i.focus();},10);}
function ckState(){

const qUnit=u=>!u||u==='กระสอบ'?'กส.':u;
function qPalRange(ps){
  const n=ps.map(x=>parseInt(x,10)).filter(x=>!isNaN(x)).sort((a,b)=>a-b);if(!n.length)return {a:'',b:'',txt:ps.filter(Boolean).join(', ')};
  const runs=[];n.forEach(x=>{const r=runs[runs.length-1];if(r&&x===r[1]+1)r[1]=x;else if(!r||x!==r[1])runs.push([x,x]);});
  return {a:n[0],b:n[n.length-1],gap:runs.length>1,txt:runs.map(r=>r[0]===r[1]?r[0]:r[0]+'–'+r[1]).join(', ')};
}
function qGroups(rows){
  const R=QK==='recv',m=new Map();
  rows.forEach(r=>{const k=(r.product_id||'')+'|'+(r.lot_no||'');let g=m.get(k);
    if(!g){g={product_id:r.product_id,product_name:r.product_name,lot_no:r.lot_no,packaging:r.packaging||'',mfg:r.mfg||'',exp:r.exp||'',unit:qUnit(r.unit),group:r.group||'',
      rows:[],qty:0,kg:0,wu:0,man:[],loc:[],note:[]};m.set(k,g);}
    const add=(a,v)=>{v=String(v||'').trim();if(v&&!a.includes(v))a.push(v);};
    g.rows.push(r);g.qty+=+r.qty||0;g.kg+=+r.total_kg||0;if(!g.mfg&&r.mfg)g.mfg=r.mfg;if(!g.exp&&r.exp)g.exp=r.exp;
    g.wu=g.wu||(R?+r.weight_unit||0:(r.qty?Math.round((r.total_kg||0)/r.qty*100)/100:0));
    add(g.man,R?r.receive_man:r.issue_by);add(g.loc,R?r.location:r.customer_id);add(g.note,r.note||r.memo);});
  return [...m.values()].map(g=>{
    const q=g.rows.map(r=>+r.qty||0),full=Math.max(0,...q),nf=q.filter(x=>x===full).length,part=q.filter(x=>x!==full);
    g.full=full;g.fullKg=g.rows.reduce((a,r)=>Math.max(a,(+r.qty||0)===full?+r.total_kg||0:0),0);

}

        <div><div class="dot"></div>(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)<br><b>หัวหน้าหน่วยสินค้าสำเร็จรูป</b></div></div>

async function pkAccMake(n){
  if(!confirm(L(`สร้างใบพาเลท QR ${n0(n)} ใบ จากประวัติรับเข้า Access?\nทุกใบ = อนุมัติแล้ว + ย้ายเข้า FG แล้ว · สต็อกไม่เปลี่ยน`,`Make ${n0(n)} QR pallet slips from the Access receive history?\nEvery slip = packing-approved + moved to FG · stock does not change`)))return;
  const b=$('#pkAccB');b.disabled=true;b.textContent=L('กำลังสร้าง…','Making slips…');
  try{const r=await post('/api/fg/access-slips');alert(L('สร้างแล้ว','Made')+' '+n0(r.made)+' '+L('ใบ','slips'));$('#pkAcc').innerHTML='';pkLoad();}
  catch(e){alert(e.message);b.disabled=false;}
}
let PKQT=null,PKVIEW=[];
function pkName(force){const p=(PRODS||[]).find(x=>x.code===$('#sfPc').value.trim()),n=$('#pkPn');if(!n)return;
  // the name box follows the FG code — unless the person is typing in it right now
  if(force||document.activeElement!==n)n.value=p?p.name:'';n.title=p?p.name:'';}
function pkNameTyped(){const n=$('#pkPn'),c=$('#sfPc');if(!n||!c)return;
  const p=(PRODS||[]).find(x=>x.code===c.value.trim());
  if(p&&n.value.trim()!==p.name){c.value='';slipProd('sf');pkLive();}}       // name changed by hand: the old code no longer applies
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function pkExpM(m){const mf=$('#sfMfg').value;if(!mf){alert(L('ใส่วันผลิตก่อน','Enter the MFG date first'));return;}
  const d=new Date(mf+'T00:00:00');d.setMonth(d.getMonth()+m);$('#sfExp').value=ymd(d);pkExpChip();expAskB('sf');pkLive();}
/* b538 — some products print "B." after the expiry date: ask each time the expiry is chosen */
function expBTag(pre){const t=$('#'+pre+'ExpBt'),b=($('#'+pre+'ExpB')||{}).value,f=($('#'+pre+'ExpF')||{}).value,ex=($('#'+pre+'Exp')||{}).value;if(!t)return;
  t.innerHTML=ex&&(b||f)?`<span class="pill" style="background:#EDE9FE;color:#5B21B6;cursor:pointer" onclick="expAskB('${pre}')" title="${L('แก้ไข','Change')}">${L('พิมพ์','Prints')}: <b>${expFmt(ex,f)}${b?' '+b:''}</b> ✎</span>`:'';}
const EXPF=['dd/mm/yy','dd/mm/yyyy','yy/mm/dd','mm/yyyy','yyyy/mm/dd','dd mm yyyy'];   // b549: + yyyy/mm/dd, dd mm yyyy
function expFmt(d,f){if(!d||d.length<10)return '-';const Y=d.slice(0,4),y=d.slice(2,4),m=d.slice(5,7),dd=d.slice(8,10);
  return ({'dd/mm/yy':`${dd}/${m}/${y}`,'yy/mm/dd':`${y}/${m}/${dd}`,'mm/yyyy':`${m}/${Y}`,'yyyy/mm/dd':`${Y}/${m}/${dd}`,'dd mm yyyy':`${dd} ${m} ${Y}`}[f])||`${dd}/${m}/${Y}`;}
const expTxt=s=>expFmt(s.exp,s.exp_fmt)+(s.exp_sfx?' '+s.exp_sfx:'');
/* b539 — when the expiry date is chosen, the packer answers 2 questions: 1) how the date is
   printed, 2) add "B." or not. The answers go on the slip; the date itself stays a real date. */
function expAskB(pre){
  const ex=($('#'+pre+'Exp')||{}).value;if(!ex){$('#'+pre+'ExpB').value='';$('#'+pre+'ExpF').value='';expBTag(pre);return;}
  let f0=($('#'+pre+'ExpF')||{}).value;if(!f0){try{f0=localStorage.getItem('fg_exp_fmt')||'';}catch(e){}}if(!EXPF.includes(f0))f0='dd/mm/yyyy';
  const b0=($('#'+pre+'ExpB')||{}).value==='B.';
  const o=document.createElement('div');o.id='expBdlg';o.className='ov';o.style.zIndex=120;
  o.innerHTML=`<div class="modal" style="max-width:460px"><h2>${L('วันหมดอายุ','Expiry date')} · <span class="mono">${fmtD(ex)}</span></h2>
   <b>1. ${L('รูปแบบวันที่ที่พิมพ์','Date format to print')}</b>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px">${EXPF.map(f=>`<label class="card" style="margin:0;padding:9px 10px;display:flex;gap:8px;align-items:center;cursor:pointer">
     <input type="radio" name="expF" value="${f}" ${f===f0?'checked':''} onchange="expPv('${ex}')" style="width:18px;height:18px"><span><b class="mono">${f}</b><br><small class="muted mono">${expFmt(ex,f)}</small></span></label>`).join('')}</div>
   <b>2. ${L('ต้องการใส่ “B.” ไหม?','Do you want to include “B.”?')}</b>
   <div style="display:flex;gap:10px;margin:8px 0 12px">${[[0,L('ไม่','No')],[1,L('ใช่ ใส่ B.','Yes, include B.')]].map(([v,t])=>`<label class="card" style="margin:0;padding:9px 14px;display:flex;gap:8px;align-items:center;cursor:pointer;flex:1">
     <input type="radio" name="expB" value="${v}" ${(v===1)===b0?'checked':''} onchange="expPv('${ex}')" style="width:18px;height:18px"><b>${t}</b></label>`).join('')}</div>
   <div style="background:#F5F3FF;border-radius:8px;padding:10px 12px;font-size:17px">EXP <b id="expPv" style="color:#5B21B6"></b></div>
   <div class="btns" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="expOk" style="min-width:120px">${L('ตกลง','OK')}</button></div></div>`;
  document.body.appendChild(o);expPv(ex);
  $('#expOk').onclick=()=>{const f=(document.querySelector('input[name=expF]:checked')||{}).value||'dd/mm/yyyy',b=(document.querySelector('input[name=expB]:checked')||{}).value==='1';
    $('#'+pre+'ExpF').value=f;$('#'+pre+'ExpB').value=b?'B.':'';try{localStorage.setItem('fg_exp_fmt',f);}catch(e){}
    expBTag(pre);if(pre==='sf')pkLive();o.remove();};
}
function expPv(ex){const f=(document.querySelector('input[name=expF]:checked')||{}).value,b=(document.querySelector('input[name=expB]:checked')||{}).value==='1';
  const e=$('#expPv');if(e)e.textContent=expFmt(ex,f)+(b?' B.':'');}

function pkExpChip(){const mf=$('#sfMfg').value,ex=$('#sfExp').value;
  document.querySelectorAll('.pkx button').forEach(b=>{let on=false;if(mf&&ex){const d=new Date(mf+'T00:00:00');d.setMonth(d.getMonth()+(+b.dataset.m));on=ymd(d)===ex;}b.classList.toggle('on',on);});}
/* b524: Finish lot — per packing machine. When the last machine still on this lot finishes,
   ask if the lot will come back (numbers continue) or is closed. A closed lot typed again:
   continue the numbers, or start a new run from #1 (QR carries the run, so nothing repeats). */
let PKLOT=null,PKASKED='';

  const v=slipVals('sf');

  let st;try{st=await api(`/api/fg/slips-next?product=${encodeURIComponent(v.product_code)}&lot=${encodeURIComponent(v.lot_no)}`);}catch(e){$('#sfMsg').innerHTML=err(e);return;}
  const ms=st.machines||[],open=ms.filter(m=>!m.finished);
  const head=`<h2>🏁 ${L('จบล็อต','Finish lot')}</h2><div class="card" style="margin-bottom:10px"><b class="mono" style="font-size:18px">${esc(v.lot_no)}</b> · ${esc(v.product_code)}${st.run>1?` · ${L('รอบ','Run')} ${st.run}`:''}<div class="muted">${L('ใบล่าสุด','Last slip')} #${st.next-1}</div></div>`;
  if(!open.length){dlg(head+`<div class="msg m-bad">${ms.length?L('ทุกเครื่องจบล็อตนี้แล้ว','All machines already finished this lot'):L('ยังไม่มีใบพาเลทของล็อตนี้','No slips for this lot yet')}</div><div class="btns" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeDlg()">${L('ปิด','Close')}</button></div>`);return;}
  dlg(head+`<b>${L('เลือกเครื่องแพคที่จบล็อตนี้','Choose the packing machine(s) that finished this lot')}</b>
   <div id="pkFm" style="display:grid;gap:6px;margin:8px 0 12px">${ms.map(m=>`<label class="card pkfm${m.finished?' dis':''}" style="display:flex;gap:10px;align-items:center;padding:10px 12px;margin:0">

/* this PC's folder: the handle is kept in IndexedDB (Chrome / Edge). Writing needs the browser's

const LF={h:null,ok:false};
function lfDb(){return new Promise((res,rej)=>{const q=indexedDB.open('fg_lf',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}

  const q=v===undefined?st.get(k):st.put(v,k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}

   Print + Update now; while it stays open it updates itself every 30 minutes with the slips

async function shrPreview(d,sh,lot,w){
  w=w||window.open('','_blank');if(!w){alert(L('อนุญาต pop-up เพื่อดูตัวอย่าง','Allow pop-ups to preview'));return;}
  let r;try{r=await api(`/api/fg/shift-report-data?d=${d}&shift=${sh}&lot=${encodeURIComponent(lot||'')}`);}catch(e){w.close();alert(e.message);return;}
  const packs={};r.lots.forEach(o=>{if(o.packs&&o.packs.length)packs[shpK(o)]=o.packs;});

/* lots inside a shift — each lot is its own report (print / Excel) */
async function shrLots(btn,d,sh){
  const tr=btn.closest('tr'),nx=tr.nextElementSibling;
  if(nx&&nx.classList.contains('shlots')){nx.remove();return;}
  let r;try{r=await api(`/api/fg/shift-report-data?d=${d}&shift=${sh}`);}catch(e){alert(e.message);return;}
  const row=document.createElement('tr');row.className='shlots';
  row.innerHTML=`<td colspan="8" style="background:#F8FAFC;padding:6px 14px">${r.lots.map(o=>`<div style="display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)">
     <b class="mono" style="min-width:130px">${esc(o.lot_no)}</b><span style="flex:1"><b>${esc(o.product_code)}</b> · ${esc(o.product_name)}</span>
     <span class="nw">${o.pallets} ${L('พาเลท','pallets')} · ${n0(o.bags)} ${L('ถุง','bags')} · ${n0(o.kg)} kg${o.pages.length>1?` · ${o.pages.length} ${L('หน้า','pages')}`:''}</span>
     <button class="btn sm" onclick="shrPreview('${d}','${sh}',${esc(JSON.stringify(o.lot_no))})">👁 ${L('ดูตัวอย่าง','Preview')}</button>
     <button class="btn sm" onclick="shrPrint('${d}','${sh}',${esc(JSON.stringify(o.lot_no))})">🖨 ${L('พิมพ์','Print')}</button>
     <button class="btn sm" onclick="shrLotX('${d}','${sh}',${esc(JSON.stringify(o.lot_no))})">⬇ Excel</button></div>`).join('')||`<span class="muted">${L('ไม่มีล็อตในกะนี้','No lots in this shift')}</span>`}</td>`;
  tr.after(row);

async function shrLotX(d,sh,lot){
  try{const r=await fetch(`/api/fg/shift-report?d=${d}&shift=${sh}&lot=${encodeURIComponent(lot)}`,{credentials:'same-origin'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const cd=r.headers.get('Content-Disposition')||'',fn=(cd.match(/filename="([^"]+)"/)||[])[1]||'packing.xlsx';
    const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}catch(e){alert(e.message||e);}
}
async function shrGet(id){
  try{const r=await fetch(`/api/fg/shift-reports/${id}/file`,{credentials:'same-origin'});
    if(!r.ok){let m='HTTP '+r.status;try{const x=await r.json();m=(x.detail&&x.detail.msg)||m;}catch(e){}throw new Error(m);}
    const cd=r.headers.get('Content-Disposition')||'',fn=(cd.match(/filename="([^"]+)"/)||[])[1]||'shift-report.xlsx';
    const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  }catch(e){alert(e.message||e);}
}
/* b555 — "Make now": file the report of the shift running now (so far), straight into the list below.
   The end-of-shift run still replaces it with the full shift. */
async function shrMakeNow(){
  const d=shDay(),sh=shNow(),N={m:L('กะเช้า','Morning'),a:L('กะบ่าย','Afternoon'),n:L('กะดึก','Night')}[sh],b=$('#shNowB');
  if(!confirm(L(`สร้างรายงาน ${N} วันที่ผลิต ${fmtD(d)} ตอนนี้? (ข้อมูลถึงเวลานี้)`,`Make the ${N} report for production day ${fmtD(d)} now? (data up to now)`)))return;
  if(b)b.disabled=true;
  try{await post('/api/fg/shift-reports/remake',{d,shift:sh});}catch(e){alert(e.message);if(b)b.disabled=false;return;}
  if(b)b.disabled=false;if(SHF.d2&&SHF.d2<d){SHF.d2=d;if($('#shr2'))$('#shr2').value=d;}await shrLoad();
}
async function shrRemake(d,sh){
  if(!confirm(L('สร้างรายงานกะนี้ใหม่ ด้วยข้อมูลล่าสุด?','Make this shift report again with the latest data?')))return;
  try{await post('/api/fg/shift-reports/remake',{d,shift:sh});}catch(e){alert(e.message);return;}shrLoad();
}

/* b554: a filter chip (packing machine / status) redraws the register without moving the page —
   the list keeps its height while it is redrawn, so a shorter list does not pull the page up */
function pkDrawKeep(){const y=window.scrollY,el=$('#pkList'),tw=el&&el.querySelector('.tw'),ty=tw?tw.scrollTop:0;
  if(el)el.style.minHeight=el.offsetHeight+'px';pkDraw();
  const t2=el&&el.querySelector('.tw');if(t2)t2.scrollTop=ty;window.scrollTo(0,y);requestAnimationFrame(()=>window.scrollTo(0,y));}

/* b524 — scanning the slip on the pallet approves it (the paper is already stuck on). A slip
   scanned a second time — here or on any other PC / phone — sounds an alarm that keeps going
   until somebody presses Reset. */
async function psGot(text,via){
  PSVIA=via||'usb';const t=(text||'').trim();
  try{
    const d=await post('/api/fg/slips-scan',{text:t,via:PSVIA,approve:true});
    psAdd(d.slip,(d.prints||[]).length,d.dup);
    psMsg(d.dup?'dup':'ok',`${esc(d.slip.lot_no)} #${esc(d.slip.pallet_no)}`);
    if(d.dup)psAlarm(d.slip);else psBeep(true);
  }catch(e){
    if(e.status===401)return;                 // b545: the sign-in panel is already up
    if(psNetErr(e)&&t){psQAdd(t,PSVIA);psFocus();return;}   // b552: no connection — kept here, sent later
    if(e.status===409&&e.detail&&e.detail.block){psBlock(e.detail.block,e.detail.slip);return;}   // b553: interlock
    if(!t.startsWith('{')&&t.length>=4){
      try{const r=await api(`/api/fg/slips?all=1&q=${encodeURIComponent(t)}&limit=60`);
        const rows=(r.rows||[]).filter(s=>s.status==='packed'||s.status==='cancelled');
        if(rows.length){rows.forEach(s=>psAdd(s,s.print_count||0,false,true));psMsg('');psBeep(true);psFocus();return;}}catch(x){}
    }
    let bad=false;if(t.startsWith('{')){try{JSON.parse(t);}catch(x){bad=true;}}
    PSL.unshift({err:bad?L('อ่าน QR ไม่ครบ / สแกน 2 เครื่องพร้อมกัน — สแกนใหม่','QR not read completely (or two scanners at once) — scan again'):(e.message||L('ไม่พบ','not found')),raw:t.slice(0,80),at:Date.now()});
    psSave();psDrawList();psBeep(false);psMsg('bad');
  }
  psFocus();
}

async function accUpload(){

  R.innerHTML=`<div class="msg">${L('กำลังอัปโหลด','Uploading')} ${(f.size/1048576).toFixed(1)} MB …</div>`;
  try{
    const r=await fetch('/api/fg/import-accdb?name='+encodeURIComponent(f.name),{method:'POST',body:await f.arrayBuffer(),
      headers:{'Content-Type':'application/octet-stream'},credentials:'same-origin'});

  }catch(e){R.innerHTML=`<div class="msg m-bad">${esc(e.message||e)}</div>`;}
  b.disabled=false;b.textContent='⬆ '+L('อัปโหลดและนำเข้า','Upload & import');

    hdr();$('#app').innerHTML=`<div class="card" style="max-width:520px;margin:40px auto"><h1>${L('ยังไม่มีสิทธิ์ใช้ FG Stock','No FG Stock access yet')}</h1><p>${esc(e.message)}</p><button class="btn" onclick="location.href='/?fn=cmms'">CMMS</button></div>`;return;}
  FN=FnBar.current(ME);
  if(FN==='cmms'){location.href='/?fn=cmms';return;}
  await refreshCounts();hdr();buildNav();
  const start=(location.hash||'').slice(1)||fnStart();
  go(start,true);
  setInterval(()=>{if(document.hidden)return;   // b5xx: hidden tab — nothing to refresh
    if(PAGE==='queue'&&!Object.values(QSEL).some(Boolean)&&!$('#dlg'))qLoad();else refreshCounts();},60000);   // b5xx: was 30 s
}
function fnStart(){return FN==='checker'?(isAdmin()?'home':'queue'):(fnPages()[0]||'home');}
function switchFn(f){
  FN=f;try{sessionStorage.setItem('bflfp_fn',f)}catch(e){}
  history.replaceState(null,'','/fg.html?fn='+f);
  hdr();buildNav();go(fnStart());
}
window.addEventListener('hashchange',()=>{const p=(location.hash||'#home').slice(1);if(p!==PAGE&&ME)go(p,true);});
start();
</script>
