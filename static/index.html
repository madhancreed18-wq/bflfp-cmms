<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BFLFP Maintenance</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F97316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BFLFP">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--or:#1B75BC;--ord:#0F3D6E;--navy:#16324A;--bg:#F1F5F9;--bd:#D9E6F2;--red:#DC2626;--green:#43A047;--blue:#1B75BC;--gray:#5C789A;--amber:#D97706;--hbg:#0F3D6E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',system-ui,sans-serif;background:var(--bg);color:var(--navy);font-size:15px;-webkit-tap-highlight-color:transparent}
header{background:var(--hbg);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header .logo{background:#fff;border-radius:9px;padding:4px 7px;display:flex;align-items:center;flex:none}
header .logo img{height:24px;display:block}
header h1{font-size:16px;font-weight:600;letter-spacing:.3px}
header h1 small{display:block;font-size:10px;font-weight:400;color:#CBD5E1;letter-spacing:1px}
header .who{margin-left:auto;font-size:12px;color:#CBD5E1;text-align:right;line-height:1.3}
header .btn{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.card h2{display:flex;align-items:center;gap:8px}
.btn{display:inline-block;border:none;border-radius:8px;padding:10px 16px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;background:#fff;border:1px solid var(--bd)}
.btn.primary{background:var(--or);color:#fff;border-color:var(--or)}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;width:100%;background:#fff}
label{font-size:12px;color:var(--gray);display:block;margin:8px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:999px}
.s-Reported{background:#FEF3C7;color:#92400E}.s-Assigned{background:#E0E7FF;color:#3730A3}
.s-Released{background:#DBEAFE;color:#1E40AF}.s-InProgress{background:#DCFCE7;color:#166534}
.s-Paused{background:#FFEDD5;color:#9A3412}.s-ServiceCompleted{background:#D1FAE5;color:#065F46}
.s-Done{background:#334155;color:#fff}.s-Hold{background:#FEE2E2;color:#991B1B}
.s-WaitingApproval{background:#FEF3C7;color:#92400E}.s-WaitingAssignment{background:#EDE9FE;color:#5B21B6}
.s-Rework{background:#FCE7F3;color:#9D174D}.s-Rejected{background:#FEE2E2;color:#991B1B}
.pcard{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.pcard .top{display:flex;align-items:flex-start;gap:8px}
.pcard .ttl{font-weight:600;font-size:15px}
.pcard .prd{font-size:11px;color:#94A3B8;text-align:right;white-space:nowrap}
.pcard .info{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:8px 0 6px;font-size:12px}
.pcard .info b{font-weight:500}
.pill{display:inline-block;font-size:11px;font-weight:500;padding:3px 12px;border-radius:999px}
.pill.lo{background:#DCFCE7;color:#166534}.pill.md{background:#FEF3C7;color:#92400E}.pill.hi{background:#FEE2E2;color:#991B1B}
.pill.src{background:#F1F5F9;color:#475569}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--gray);z-index:5}
.switch{margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.switch .trk{width:38px;height:20px;border-radius:999px;background:#CBD5E1;position:relative;transition:.15s}
.switch .trk::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch.on .trk{background:var(--or)}.switch.on .trk::after{left:20px}
/* ---- v2.2 login (Bluefalo navy) ---- */
body.lgbg{background:linear-gradient(180deg,#0F3D6E 0%,#16324A 100%)}
.lgwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:44px 20px 24px}
.lgchip{background:#fff;border-radius:18px;padding:12px 20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.lgchip img{height:52px;display:block}
.lgwrap h2{color:#fff;font-size:24px;font-weight:700;margin-top:22px;letter-spacing:.3px}
.lgwrap .lgsub{color:#9DBBD9;font-size:12.5px;margin-top:3px}
.lgcard{background:#EDF2F7;border-radius:22px;padding:24px 22px;width:100%;max-width:370px;margin-top:26px;box-shadow:0 18px 44px rgba(0,0,0,.3)}
.lgcard h3{color:#1B75BC;text-align:center;font-size:21px;font-weight:700;margin-bottom:6px}
.lgfield{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #D9E6F2;border-radius:12px;padding:12px 13px;margin-top:13px}
.lgfield span{color:#9DB6CC;font-size:15px}
.lgfield input{border:none;outline:none;flex:1;font-family:inherit;font-size:14.5px;background:transparent;padding:0;width:auto}
.lgfield select{border:none;outline:none;flex:1;font-family:inherit;font-size:14.5px;background:transparent;padding:0;color:var(--navy);margin:0;width:auto}
.lgfacs{display:flex;gap:10px;margin-top:4px}
.lgfac{flex:1;background:#fff;border:2px solid #D9E6F2;border-radius:14px;padding:10px 4px 8px;text-align:center;cursor:pointer;transition:border-color .15s}
.lgfac img{height:42px;max-width:100%;object-fit:contain;display:block;margin:0 auto}
.lgfac .c{font-size:11.5px;font-weight:700;color:var(--navy);margin-top:5px;letter-spacing:.3px}
.lgfac.on{border-color:#1B75BC;background:#EAF3FB;box-shadow:0 3px 10px rgba(27,117,188,.2)}
.lgfac.on .c{color:#1B75BC}
.lglang{display:flex;gap:8px;margin:12px 0 0}
.lglang button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:4px 16px;font-family:inherit;font-size:12.5px;cursor:pointer}
.lglang button.on{background:#fff;color:#0F3D6E;font-weight:700;border-color:#fff}
.lgfield .eye{cursor:pointer;margin-left:auto}
.lgrm{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:13.5px;color:#41608A;cursor:pointer;user-select:none}
.lgrm input{width:17px;height:17px;accent-color:#1B75BC}
.lgbtn{width:100%;background:#43A047;color:#fff;border:none;border-radius:12px;padding:14px;font-family:inherit;font-size:15.5px;font-weight:700;margin-top:18px;cursor:pointer;box-shadow:0 6px 16px rgba(67,160,71,.35)}
.lgbtn:active{transform:scale(.99)}
.lgfoot{color:#7FA0C2;font-size:11px;margin-top:auto;padding-top:26px;text-align:center}
.lgerr{color:#FCA5A5;background:rgba(224,49,49,.15);border:1px solid rgba(224,49,49,.35);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-top:12px;display:none}
.lgcap{background:#fff;border:1.5px solid #F3C4C4;border-radius:12px;padding:12px;margin-top:14px}
.lgcap .t{font-size:12px;font-weight:700;color:var(--red);margin-bottom:8px}
/* ---- bottom navigation ---- */
.bnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:6;box-shadow:0 -4px 16px rgba(15,61,110,.08);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;background:none;border:none;font-family:inherit;padding:8px 2px 9px;cursor:pointer;color:var(--gray);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.bnav button .ic{font-size:20px;line-height:1}
.bnav button.on{color:var(--blue)}
.bnav button.on .ic{transform:translateY(-1px)}
.bnav button.on::before{content:'';position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.bnav button{position:relative}
.p3{color:var(--red);font-weight:600}.p2{color:var(--amber);font-weight:500}
.jobline{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}
.jobline:first-child{border-top:none}
.grow{flex:1;min-width:0}
.muted{color:var(--gray);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.kpi .v{font-size:26px;font-weight:600}
.kpi .l{font-size:12px;color:var(--gray)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs .btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#gantt{overflow-x:auto}
.grow .d{font-weight:500;font-size:14px}
.banner{background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.banner .t{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto}
.hidden{display:none}
.legend{display:flex;gap:12px;font-size:12px;color:var(--gray);flex-wrap:wrap;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
dialog{border:none;border-radius:14px;padding:18px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(15,23,42,.5)}
.d2col{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start}
.d2side{position:sticky;top:64px}
.d2side .card{max-height:calc(100vh - 150px);display:flex;flex-direction:column;overflow:hidden}
.d2side .chatscroll{overflow-y:auto;flex:1;min-height:120px}
@media(max-width:900px){.d2col{grid-template-columns:1fr}.d2side{position:static}.d2side .card{max-height:none;overflow:visible}}
@media(min-width:1150px){main:has(.d2col){max-width:1240px}}
</style>
</head>

const api=async(url,opt={})=>{
  const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});
  if(r.status===401){renderLogin();throw new Error('login')}
  if(!r.ok){alert((await r.json()).detail||'error');throw new Error('api')}
  return r.json();
};

function lgError(msg){const e=$('#lgErr');if(e){e.textContent=msg;e.style.display='block'}}
async function loadCaptcha(){
  const c=await (await fetch('/api/captcha')).json();
  window._capTok=c.token;
  const b=$('#capBox');if(b){b.classList.remove('hidden');$('#capImg').src=c.image;$('#cap_in').value='';}
}
async function doLogin(){
  const remember=$('#rm')?$('#rm').checked:false;
  const body={username:$('#u').value.trim(),password:$('#p').value,remember,factory_id:FACSEL};
  if(window._capTok&&$('#cap_in')){body.captcha_token=window._capTok;body.captcha_answer=$('#cap_in').value;window._capTok=null;}
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){
    ME=await r.json();
    if(remember)localStorage.setItem('bflfp_user',body.username);
    else localStorage.removeItem('bflfp_user');
    localStorage.setItem('bflfp_factory',String(FACSEL));
    afterLogin();return;
  }
  let d={};try{d=(await r.json()).detail||{}}catch(e){}
  if(r.status===429){lgError(typeof d==='string'?d:(d.msg||'พยายามหลายครั้งเกินไป กรุณารอสักครู่'));return;}
  if(d&&d.captcha_required){await loadCaptcha();$('#capMsg').textContent=d.msg||'';lgError(d.msg||'กรุณากรอกรหัสจากภาพ');return;}
  lgError(typeof d==='string'?d:(d.msg||'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'));
}

}

function urlB64(s){const p='='.repeat((4-s.length%4)%4);const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function setupPush(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window))return;
    if(!(location.protocol==='https:'||location.hostname==='localhost'))return;
    const {enabled,key}=await api('/api/push/key');
    if(!enabled||!key)return;
    const reg=await navigator.serviceWorker.ready;
    if(Notification.permission==='denied')return;
    if(Notification.permission!=='granted'&&await Notification.requestPermission()!=='granted')return;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(key)});
    await post('/api/push/subscribe',{subscription:sub.toJSON()});
  }catch(e){console.warn('push setup:',e)}
}

function initSig(cv){
  const ctx=cv.getContext('2d');ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#1E293B';
  let draw=false;
  const pos=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;
    return[(p.clientX-r.left)*cv.width/r.width,(p.clientY-r.top)*cv.height/r.height]};
  const dn=e=>{draw=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()};
  const mv=e=>{if(!draw)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault()};
  cv.addEventListener('pointerdown',dn);cv.addEventListener('pointermove',mv);
  addEventListener('pointerup',()=>draw=false);
  cv._used=()=>cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data.some(v=>v>0&&v<255);
}
function clearSig(k){const cv=$('#sig_'+k);cv.getContext('2d').clearRect(0,0,cv.width,cv.height)}
async function saveSig(id,k){
  const cv=$('#sig_'+k);
  await post(`/api/jobs/${id}/media`,{kind:k,data:cv.toDataURL('image/png')});
  renderDetail(id);
}
async function uploadPhoto(id,kind,inp){
  const f=inp.files[0];if(!f)return;
  const img=new Image();img.src=URL.createObjectURL(f);
  await img.decode();
  const max=1024,sc=Math.min(1,max/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  await post(`/api/jobs/${id}/media`,{kind,data:cv.toDataURL('image/jpeg',0.85)});
  renderDetail(id);
}

async function toDataURL(f){
  if(!f)return '';
  const img=new Image();img.src=URL.createObjectURL(f);await img.decode();
  const sc=Math.min(1,1024/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',0.85);
}

      <span>MTBF <b>${fmin(m.mtbf_min)}</b></span>
      <span>MTTR <b>${fmin(m.mttr_min)}</b></span>
      <span>Downtime <b>${fmin(m.downtime_min)}</b></span>
    </div></div>`).join('')}`;
}
async function renderMachine(mid){
  stopPoll();
  const h=await api(`/api/machines/${mid}/history`);
  const m=h.machine;
  $('#app').innerHTML=`
  <div class="tabs"><button class="btn" onclick="renderMachines()">${t('back')}</button></div>
  <div class="card"><h2 style="font-size:17px">${m.code} — ${esc(m.name)}</h2>
    <p class="muted">${m.line} · ${t('m_cr')} ${m.criticality} · Ideal ${m.ideal_rate||'—'} · PM ${LANG==='TH'?'ทุก':'every'} ${m.pm_freq_days||'—'} ${LANG==='TH'?'วัน':'days'}</p></div>
  <div class="card"><h2 style="font-size:15px">${t('hs_t')} (${h.jobs.length})</h2>
    ${h.jobs.map(j=>`<div class="jobline"><div class="grow" style="cursor:pointer" onclick="renderDetail(${j.id})">
      <div class="d">${j.jobtype==='BD'?'🔴':j.jobtype==='PM'?'🗓':'🔧'} ${j.jobid} · ${(j.created_at||'').slice(0,10)} ›</div>
      <div class="muted">${esc(j.descr).slice(0,80)} ${j.solution?'· '+t('hs_fix')+': '+esc(j.solution).slice(0,40):''}</div></div>
      <span class="tag s-${j.status}">${sT(j.status)}</span></div>`).join('')||`<p class="muted">${t('none')}</p>`}
  </div>
  <div class="card"><h2 style="font-size:15px">${t('hs_sl')} (${h.shiftlogs.length})</h2>
    ${h.shiftlogs.map(s=>`<div class="jobline"><div class="grow">
      <div class="d">${s.log_date} ${t('w_shift')}${s.shift}</div>
      <div class="muted">${t('w_plan')} ${s.planned_min} ${t('w_min')} · ${t('w_out')} ${s.output} · ${t('w_good')} ${s.good} · ${t('w_rej')} ${s.reject}</div></div></div>`).join('')||`<p class="muted">${t('hs_none_sl')}</p>`}
  </div>`;
}

/* ---------------- DASHBOARD (manager + planner) ---------------- */
function spark(series,key){
  const vals=series.map(s=>s[key]).map(v=>v==null?0:v);
  const mx=Math.max(...vals,1);
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*100).toFixed(1)},${(28-v/mx*24).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 30" style="width:100%;height:26px;margin-top:4px"><polyline points="${pts}" fill="none" stroke="var(--or)" stroke-width="2"/></svg>`;
}
function tcard(v,label,target,sub,less){
  const ok=v==null?null:(less?v<=target:v>=target);
  const col=v==null?'var(--gray)':ok?'var(--green)':'var(--red)';
  return `<div class="kpi"><div class="v" style="color:${col}">${typeof v==='number'?(label.includes('MTTR')?fmin(v):v+'%'):(v==null?'—':v)}</div>
    <div class="l">${label}</div><div class="muted">${t('target')} ${less?'≤':'≥'} ${label.includes('MTTR')?fmin(target):target+'%'}${sub?' · '+sub:''}</div></div>`;
}
async function renderDash(){
  stopPoll();
  const [d,k,tr]=await Promise.all([api('/api/dashboard'),api('/api/kpi'),api('/api/kpi/trend?days=14')]);
  const pk=k.plant,tg=k.targets;
  const segColor=s=>s.jobtype==='BD'?'var(--red)':s.seg_type==='work'?'var(--blue)':s.seg_type==='routine'?'var(--gray)':'var(--amber)';
  const H0=7,H1=20,W=60;
  const x=t=>{const[h,m]=t.slice(11,16).split(':').map(Number);return (h-H0+m/60)*W}
  const techs={};
  d.segments.forEach(s=>{(techs[s.tech_name]=techs[s.tech_name]||[]).push(s)});
  const planned={};
  d.planned.forEach(j=>{if(j.lead_name&&j.planned_start){(planned[j.lead_name]=planned[j.lead_name]||[]).push(j)}});
  Object.keys(planned).forEach(k=>{techs[k]=techs[k]||[]});
  const names=[...new Set([...Object.keys(techs),...Object.keys(planned)])];
  const axis=Array.from({length:H1-H0+1},(_,i)=>`<div style="position:absolute;left:${i*W}px;top:0;bottom:0;border-left:1px dashed #EEF2F7"><span style="font-size:10px;color:var(--gray)">${String(H0+i).padStart(2,'0')}</span></div>`).join('');
  const rows=names.map(n=>{
    const plan=(planned[n]||[]).map(j=>`<div title="${j.jobid} plan" style="position:absolute;top:2px;height:8px;border-radius:4px;background:#CBD5E1;left:${(+j.planned_start.slice(0,2)-H0+ +j.planned_start.slice(3)/60)*W}px;width:${((+j.planned_end.slice(0,2)+ +j.planned_end.slice(3)/60)-(+j.planned_start.slice(0,2)+ +j.planned_start.slice(3)/60))*W}px"></div>`).join('');
    const act=(techs[n]||[]).map(s=>{
      const end=s.end||new Date().toISOString().slice(0,19).replace('T',' ');
      const l=x(s.start),w=Math.max(4,x(end)-l);
      return `<div title="${s.jobid||s.seg_type} ${s.start.slice(11,16)}–${(s.end||'now').slice(11,16)}" style="position:absolute;top:12px;height:18px;border-radius:4px;background:${segColor(s)};left:${l}px;width:${w}px"></div>`;
    }).join('');
    return `<div style="display:flex;align-items:center;border-top:1px solid var(--bd)">
      <div style="width:110px;flex:none;font-size:12px;padding:8px 4px">${esc(n)}</div>
      <div style="position:relative;height:36px;flex:1;min-width:${(H1-H0)*W}px">${axis}${plan}${act}</div></div>`;
  }).join('');
  const pctCard=(v,l,sub)=>`<div class="kpi"><div class="v" style="color:${v===null?'var(--gray)':v>=80?'var(--green)':v>=50?'var(--amber)':'var(--red)'}">${v===null?'—':v+'%'}</div><div class="l">${l}</div><div class="muted">${sub}</div></div>`;
  $('#app').innerHTML=`
  <div class="tabs">
    <button class="btn" onclick="renderDash()">${t('refresh')}</button>
    <button class="btn" onclick="renderMachines()">📈 ${t('nv_mach')}/OEE</button>
    <a class="btn dark" href="/api/reports/daily?d=${d.date}" target="_blank">${t('db_pdf')}</a></div>
  <div class="kpis">
    <div class="kpi"><div class="v" style="color:${pk.oee==null?'var(--gray)':pk.oee>=tg.oee?'var(--green)':'var(--red)'}">${fpct(pk.oee)}</div>
      <div class="l">${t('plant7')}</div><div class="muted">${t('target')} ≥ ${tg.oee}% (batch)</div>${spark(tr.series,'oee')}</div>
    ${tcard(pk.availability,'Availability',tg.availability)}
    ${tcard(pk.pm_compliance,'PM compliance',tg.pm_compliance,'EN 15341')}
    ${tcard(pk.planned_ratio,'Planned ratio',tg.planned_ratio,t('planned_div'))}
    ${tcard(pk.ftfr,'FTFR',tg.ftfr,'first-time fix')}
    ${tcard(pk.fleet_mttr_min,'Fleet MTTR',tg.mttr_min,pk.bd_count+' BD',true)}
    <div class="kpi"><div class="v">${fmin(pk.fleet_mtbf_min)}</div><div class="l">Fleet MTBF</div><div class="muted">downtime ${fmin(pk.downtime_min)}</div><div style="margin-top:4px">${spark(tr.series,'bd')}</div></div>
    <div class="kpi"><div class="v" style="color:${(pk.backlog.b30||0)>0||(pk.backlog.p1_late||0)>0?'var(--red)':'var(--green)'}">${(pk.backlog.b0||0)+(pk.backlog.b7||0)+(pk.backlog.b30||0)}</div>
      <div class="l">Backlog (งานเปิด)</div><div class="muted">0-7วัน:${pk.backlog.b0||0} · 8-30:${pk.backlog.b7||0} · 30+:<b>${pk.backlog.b30||0}</b>${(pk.backlog.p1_late||0)?` · ⚠ด่วนค้าง ${pk.backlog.p1_late}`:''}</div></div>
  </div>
  ${pk.top_failures&&pk.top_failures.length?`<div class="card"><h2 style="font-size:15px">🔩 ${LANG==='TH'?'ชิ้นส่วนที่เสียบ่อย':'Top failure components'}</h2>
    ${pk.top_failures.map(f=>`<div class="jobline"><div class="grow"><div class="d">${esc(f.comp)}</div></div><b>${f.n}${LANG==='TH'?' ครั้ง':'×'}</b></div>`).join('')}</div>`:''}
  <div class="kpis">
    ${pctCard(d.planned_pct,'Planned completion',`${d.planned_done}/${d.planned_total} released`)}
    ${pctCard(d.bd_pct,'Breakdown completion',`${d.bd_done}/${d.bd_total} received`)}
    ${pctCard(d.total_pct,'Total completion',`${d.planned_done+d.bd_done}/${d.planned_total+d.bd_total} jobs`)}
  </div>
  <div class="card"><h2 style="font-size:16px;margin-bottom:8px">Gantt — ${d.date}</h2>
    <div id="gantt">${rows||`<p class="muted">${t('no_tl')}</p>`}</div>
    <div class="legend"><span><i style="background:var(--blue)"></i>${t('lg_planjob')}</span>
      <span><i style="background:var(--red)"></i>Breakdown</span>
      <span><i style="background:var(--gray)"></i>Routine</span>
      <span><i style="background:var(--amber)"></i>${t('lg_stand')}</span>
      <span><i style="background:#CBD5E1"></i>${t('lg_planbar')}</span></div>
  </div>
  <div class="card"><h2 style="font-size:16px;margin-bottom:6px">${t('pend_t')} (${d.pending.length})</h2>
    ${d.pending.map(j=>`<div class="jobline"><div class="grow">
      <div class="d">${j.jobid} · ${j.mcode||''} · ${j.progress}%</div>
      <div class="muted">${esc(j.pending_reason||j.status)} · ${esc(j.lead_name||'')}</div></div>
      <span class="tag s-${j.status}">${sT(j.status)}</span></div>`).join('')||`<p class="muted">${t('none_party')}</p>`}
  </div>
  <div class="card"><h2 style="font-size:16px;margin-bottom:6px">${t('all_t')}</h2>
    ${[...d.planned,...d.breakdowns].map(j=>`<div class="jobline"><div class="grow">
      <div class="d">${j.jobtype==='BD'?'🔴':''} ${j.jobid} · ${j.mcode||''}</div>
      <div class="muted">${esc(j.descr)} · ${esc(j.lead_name||t('unassigned'))}</div></div>
      <span class="tag s-${j.status}">${sT(j.status)}</span></div>`).join('')}
  </div>`;
}
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
start();renderLogin();
</script>
