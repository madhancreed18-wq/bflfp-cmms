<!doctype html>
<html lang="th">
<head>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17202A">
<title>Warehouse</title>
<style>
:root{--ink:#17202A;--ink2:#52606D;--line:#DCE2E8;--soft:#EEF1F4;--bg:#F3F5F7;--card:#fff;--blue:#0B6E99;--blue2:#E4EEF6;
  --ok:#166534;--okbg:#E3F4EA;--warn:#7A4A00;--warnbg:#FFF1D6;--bad:#9B1C14;--badbg:#FDE8E7;--hold:#5B3F8F;--holdbg:#EEE8F8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Sarabun",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:54px}
header.top .brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
header.top .sp{flex:1}
header.top .who{font-size:13px;color:#C9D3DC;text-align:right;line-height:1.2}
.tbtn{background:#2C3A47;border:0;color:#fff;border-radius:8px;padding:8px 10px;min-height:38px;cursor:pointer;font-size:13px}
.layout{display:flex;min-height:calc(100vh - 54px)}
nav.side{width:210px;background:#fff;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px}
nav.side button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink)}
nav.side button.on{background:var(--blue2);color:#0B4A6B;font-weight:600}
nav.side button:hover{background:var(--soft)}
main{flex:1;min-width:0;padding:18px;max-width:1280px}
nav.bot{display:none}
.ic{width:20px;height:20px;flex:none}
h1{font-size:22px;margin:0 0 14px}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.tile .l{font-size:13px;color:var(--ink2)}.tile .v{font-size:28px;font-weight:700}.tile .s{font-size:12px;color:var(--ink2)}
.row2{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.row2>.card{flex:1 1 340px;min-width:0}
.row2>.wide{flex:999 1 560px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--ink2);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--soft);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover{background:#F7F9FB}
.tw{overflow-x:auto}
.mono{font-family:ui-monospace,Consolas,monospace}
td.mono{white-space:nowrap}
.pill{flex:none;display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-crit,.p-expired,.p-rejected{background:var(--badbg);color:var(--bad)}
.p-none{background:var(--soft);color:var(--ink2)}.p-pending{background:var(--blue2);color:#0B4A6B}.p-released{background:#E0F2F1;color:#115E59}
.p-stored{background:var(--okbg);color:var(--ok)}.p-hold{background:var(--holdbg);color:var(--hold)}.p-picked{background:var(--warnbg);color:var(--warn)}.p-dispatched{background:var(--soft);color:var(--ink2)}
.btn{border:1px solid #A9B4BF;background:#fff;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.hold{background:#8A5300;border-color:#8A5300;color:#fff}
.btn.bad{background:#B42318;border-color:#B42318;color:#fff}
.btn.big{width:100%;min-height:56px;font-size:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
input.in,select.in,textarea.in{border:1px solid #A9B4BF;border-radius:8px;padding:9px 10px;min-height:42px;background:#fff;width:100%;font-size:15px;color:var(--ink)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}.kv>div:nth-child(odd){color:var(--ink2)}
.msg{border-radius:10px;padding:10px 12px;font-weight:600;margin:10px 0}
.m-ok{background:var(--okbg);color:var(--ok)}.m-bad{background:var(--badbg);color:var(--bad)}.m-warn{background:var(--warnbg);color:var(--warn)}.m-info{background:var(--blue2);color:#0B4A6B}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid #A9B4BF;background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;min-height:36px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.big-loc{background:var(--ink);color:#fff;border-radius:14px;padding:18px;text-align:center}
.big-loc .c{font-family:ui-monospace,Consolas,monospace;font-size:40px;letter-spacing:1px}
.big-loc .s{font-size:13px;color:#C9D3DC}
.check{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;background:#fff;cursor:pointer;text-align:left;width:100%}
.check.on{border-color:var(--blue);background:#F0F7FB}
.check .bx{width:22px;height:22px;border-radius:5px;border:2px solid #A9B4BF;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.check.on .bx{background:var(--blue);border-color:var(--blue)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:46px;height:46px;border-radius:8px;border:1px solid #A9B4BF;background:#fff;font-size:22px;cursor:pointer}
.step input{width:90px;text-align:center;font-size:22px;font-weight:700}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;flex:1}.bar>div{height:10px;background:var(--blue)}
/* rack */
.rack{overflow-x:auto;padding-bottom:6px}
.rk-row{display:flex;align-items:stretch;gap:4px;margin-bottom:4px}
.rk-lv{width:34px;flex:none;font-size:12px;font-weight:600;color:var(--ink2);display:flex;align-items:center}
.rk-bay{display:flex;gap:1px;padding:2px;border:1px solid var(--line);border-radius:4px;background:#fff}
.rk-s{width:13px;height:20px;border-radius:2px;border:1px solid transparent;cursor:pointer;padding:0}
.s-empty{background:#fff;border-color:#C3CCD5}.s-ok{background:#0B6E99}.s-warn{background:#E3A008}.s-crit,.s-expired{background:#B42318}.s-none{background:#7C8A96}.s-hold{background:#6B4FA0}.s-blocked{background:repeating-linear-gradient(45deg,#C3CCD5 0 3px,#fff 3px 6px)}
.rk-hd{display:flex;gap:4px;margin-left:38px;font-size:11px;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin:8px 0 12px}.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
/* modal + scanner */
.ov{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.scan{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .fr{position:absolute;left:50%;top:42%;width:min(70vw,320px);height:min(70vw,320px);transform:translate(-50%,-50%);border:3px solid #7FD1F5;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scan .fr.lock{border-color:#4ADE80}
.scan .hint{position:absolute;left:0;right:0;top:calc(42% + min(35vw,160px) + 16px);text-align:center;color:#fff;font-weight:600;padding:0 16px}
.scan .bt{position:absolute;left:0;right:0;bottom:0;padding:16px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.scan .bt .btn{background:#fff}
/* labels */
.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
.lab{border:1px dashed #999;padding:3mm;display:flex;align-items:center;gap:3mm;break-inside:avoid}
.lab .t{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:20pt}
.lab .u{font-size:9pt;color:#333}
@media print{header.top,nav.side,nav.bot,.noprint{display:none!important}main{padding:0}body{background:#fff}.card{border:0;padding:0}}
@media (max-width:820px){
  nav.side{display:none}
  main{padding:12px 12px 90px}
  nav.bot{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
  nav.bot button{flex:1;background:none;border:0;padding:8px 2px 10px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink2);min-height:56px;cursor:pointer}
  nav.bot button.on{color:var(--blue);font-weight:700}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tile .v{font-size:24px}
  header.top .who{display:none}
  .hide-m{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#7FD1F5" stroke-width="2" aria-hidden="true"><path d="M3 9l9-5 9 5v11H3z"/><path d="M7 20v-6h10v6"/></svg><span id="ttl">Warehouse</span> <span id="fac" style="color:#7FD1F5"></span></div>
  <div class="sp"></div>
  <div class="who" id="who"></div>
  <button class="tbtn" id="langBtn" onclick="toggleLang()">TH/EN</button>
  <button class="tbtn" onclick="location.href='/?apps=1'" title="Apps" aria-label="Apps" style="display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="hide-m">Apps</span></button>
</header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="app"><div class="card">Loading…</div></main>
</div>
<nav class="bot" id="bot"></nav>

<script>
/* ════════ Warehouse (WMS) — pages inside the CMMS login ════════
   One file, no build. Talks to /api/wms/*. Session = the CMMS cookie. */
let LANG=(()=>{try{return localStorage.getItem('bflfp_lang')||'TH'}catch(e){return 'TH'}})();
const TH=()=>LANG==='TH';
const L=(th,en)=>TH()?th:en;
let ME=null,PAGE='home',SET={warn_days:90,crit_days:30};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const can=k=>!!(ME&&ME.can.includes(k));
function toggleLang(){LANG=TH()?'EN':'TH';try{localStorage.setItem('bflfp_lang',LANG)}catch(e){}buildNav();go(PAGE,true);}

async function api(url,opt){
  const r=await fetch(url,Object.assign({credentials:'same-origin',headers:{'Content-Type':'application/json'}},opt||{}));
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const det=d&&d.detail;const e=new Error((det&&det.msg)||(typeof det==='string'?det:'')||('HTTP '+r.status));e.status=r.status;e.detail=det;throw e;}
  return d;
}
const post=(u,b)=>api(u,{method:'POST',body:JSON.stringify(b||{})});

/* ---------- labels ---------- */
const ST={pending:['รอ QC','Waiting QC'],released:['รอจัดเก็บ','Waiting put-away'],stored:['ในชั้นวาง','In rack'],hold:['กักกัน','On hold'],
  rejected:['ไม่ผ่าน','Rejected'],picked:['หยิบแล้ว','Picked'],dispatched:['ส่งออกแล้ว','Dispatched']};
const stPill=s=>`<span class="pill p-${s}">${esc(L(...(ST[s]||[s,s])))}</span>`;
function expPill(p){
  if(p.days_left==null)return `<span class="pill p-none">${L('ไม่มี EXP','No EXP')}</span>`;
  const lv=p.exp_level||'ok';
  return `<span class="pill p-${lv}">${p.days_left<0?L('หมดอายุ','Expired'):p.days_left+' '+L('วัน','d')}</span>`;
}
const fmtD=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'-';
const fmtT=s=>s?fmtD(s.slice(0,10))+' '+s.slice(11,16):'-';

/* ---------- icons ---------- */
const I=p=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={home:I('<path d="M3 11l9-7 9 7v9H3z"/>'),qc:I('<path d="M9 12l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="2"/>'),
  put:I('<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/>'),stock:I('<rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/>'),
  rack:I('<path d="M4 3v18M20 3v18M4 8h16M4 13h16M4 18h16"/>'),order:I('<path d="M3 7h13v10H3z"/><path d="M16 10h4l1 3v4h-5"/><circle cx="7" cy="18" r="1.5"/><circle cx="18" cy="18" r="1.5"/>'),
  trace:I('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),setup:I('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  scan:I('<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>')};

/* ---------- navigation ---------- */
function pages(){return [
  ['home',IC.home,L('ภาพรวม','Overview'),'view'],
  ['qc',IC.qc,L('ตรวจรับ QC','QC check'),'qc'],
  ['put',IC.put,L('จัดเก็บ / ย้าย','Put-away'),'store'],
  ['orders',IC.order,L('หยิบ / ส่งออก','Pick & dispatch'),'view'],
  ['stock',IC.stock,L('สต็อก','Stock'),'view'],
  ['rack',IC.rack,L('ผังชั้นวาง','Rack map'),'view'],
  ['trace',IC.trace,L('ตรวจย้อนกลับ','Traceability'),'view'],
  ['setup',IC.setup,L('ตั้งค่า','Setup'),'super']].filter(p=>can(p[3]));}
const BOT=['home','qc','put','orders','stock'];
function buildNav(){
  $('#side').innerHTML=pages().map(p=>`<button id="nv-${p[0]}" onclick="go('${p[0]}')">${p[1]}${esc(p[2])}</button>`).join('');
  const b=pages().filter(p=>BOT.includes(p[0])||(!can('qc')&&!can('store')&&['rack','trace'].includes(p[0])));
  $('#bot').innerHTML=b.slice(0,5).map(p=>`<button id="nb-${p[0]}" onclick="go('${p[0]}')">${p[1]}<span>${esc(p[2])}</span></button>`).join('');
}
function go(p,keep){
  if(!pages().some(x=>x[0]===p))p='home';
  PAGE=p;if(!keep)history.replaceState(null,'','#'+p);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='nv-'+p||b.id==='nb-'+p));
  stopScan();
  ({home:pgHome,qc:pgQC,put:pgPut,orders:pgOrders,stock:pgStock,rack:pgRack,trace:pgTrace,setup:pgSetup}[p])();
  window.scrollTo(0,0);
}
function err(e){return `<div class="msg m-bad">${esc(e.message||e)}</div>`;}

/* ════════ QR scanner: camera (BarcodeDetector → jsQR), photo, or typed/handheld ════════ */
let SC={stream:null,t:null,det:null,cv:null,cand:null,cb:null,busy:false};
function loadJs(src,test){return new Promise((res,rej)=>{if(test())return res();const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);});}
async function detector(){
  if(!('BarcodeDetector' in window))return null;
  try{const f=BarcodeDetector.getSupportedFormats?await BarcodeDetector.getSupportedFormats():['qr_code'];
    return f.includes('qr_code')?new BarcodeDetector({formats:['qr_code']}):null;}catch(e){return null;}
}
async function readQR(cv){
  if(SC.det){try{const c=await SC.det.detect(cv);return c&&c.length?c[0].rawValue:null;}catch(e){SC.det=null;}}
  try{await loadJs('/vendor/jsqr.js',()=>window.jsQR);}catch(e){return null;}
  const im=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,cv.width,cv.height);
  const r=window.jsQR(im.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});return r&&r.data?r.data:null;
}
async function openScan(title,cb){
  SC.cb=cb;SC.cand=null;
  const ov=document.createElement('div');ov.className='scan';ov.id='scan';
  ov.innerHTML=`<video id="scv" playsinline autoplay muted></video><div class="fr" id="scf"></div>
   <div class="hint" id="sch">${esc(title)}<br><small>${L('เล็ง QR ให้อยู่ในกรอบ ถือนิ่ง ๆ','Hold the QR inside the frame')}</small></div>
   <div class="bt"><label class="btn" style="text-align:center">📷 ${L('ถ่ายรูป QR แทน','Take a photo instead')}<input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanPhoto(this)"></label>
   <button class="btn" onclick="stopScan()">${L('ยกเลิก','Cancel')}</button></div>`;
  document.body.appendChild(ov);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#sch').textContent=L('เปิดกล้องสดไม่ได้ — ใช้ถ่ายรูปแทน','No live camera here — use the photo button');return;}
  try{SC.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});}
  catch(e){$('#sch').textContent=L('เปิดกล้องไม่ได้ — อนุญาตกล้อง หรือใช้ถ่ายรูปแทน','Cannot open the camera — allow it, or use the photo button');return;}
  if(!$('#scan')){stopScan();return;}
  const v=$('#scv');v.srcObject=SC.stream;try{await v.play()}catch(e){}
  SC.det=await detector();SC.cv=document.createElement('canvas');tick();
}
async function tick(){
  const v=$('#scv');if(!v||!$('#scan'))return;
  if(!SC.busy&&v.videoWidth){SC.busy=true;
    try{const vw=v.videoWidth,vh=v.videoHeight,s=Math.min(vw,vh)*.75,k=Math.min(1,560/s);
      SC.cv.width=SC.cv.height=Math.round(s*k);
      SC.cv.getContext('2d',{willReadFrequently:true}).drawImage(v,(vw-s)/2,(vh-s)/2,s,s,0,0,SC.cv.width,SC.cv.height);
      const raw=await readQR(SC.cv);
      if(raw){if(!SC.cand||SC.cand.raw!==raw)SC.cand={raw,t:Date.now()};$('#scf')&&$('#scf').classList.add('lock');
        if(Date.now()-SC.cand.t>350){SC.busy=false;return scanned(raw);}}
    }catch(e){}
    SC.busy=false;}
  SC.t=setTimeout(tick,140);
}
async function scanPhoto(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  try{const img=new Image();img.src=URL.createObjectURL(f);await img.decode();
    for(const z of [.5,.8,1]){const W=img.width,H=img.height,sw=W*z,sh=H*z,k=Math.min(1,1600/Math.max(sw,sh));
      const cv=document.createElement('canvas');cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
      cv.getContext('2d').drawImage(img,(W-sw)/2,(H-sh)/2,sw,sh,0,0,cv.width,cv.height);
      if(!SC.det&&!window.jsQR)SC.det=await detector();
      const raw=await readQR(cv);if(raw)return scanned(raw);}
    $('#sch').textContent=L('อ่าน QR จากรูปไม่ได้ ลองใหม่','No QR found in the photo — try again');
  }catch(e){}
}
function scanned(raw){const cb=SC.cb;stopScan();if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){};if(cb)cb(raw);}
function stopScan(){clearTimeout(SC.t);if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null;}const o=$('#scan');if(o)o.remove();}

        <div style="font-size:13px;color:var(--ink2)">${L('รหัสช่อง','Slot code')}: <b class="mono">AA01-3-2</b> = ${L('แถว AA · ช่อง 01 · ชั้น 3 · ตำแหน่ง 2','row AA · bay 01 · level 3 · position 2')}. ${L('ช่องที่มีพาเลทอยู่จะไม่ถูกลบ','Slots holding a pallet are never removed.')}</div>
        <div id="lyRes"></div><div class="btns"><button class="btn pri" onclick="saveLayout()">${L('บันทึกและสร้างช่อง','Save & build slots')}</button></div></div>`;
      const calc=()=>{const v=k=>+($('#ly-'+k).value||0);$('#lyCalc').textContent=`${v('rows')} × ${v('bays')} × ${v('levels')} × ${v('slots')} = ${(v('rows')*v('bays')*v('levels')*v('slots')).toLocaleString()} ${L('ตำแหน่งพาเลท','pallet positions')}`;};
      B.querySelectorAll('input').forEach(i=>i.oninput=calc);calc();}
    else if(SETTAB==='labels'){const d=await api('/api/wms/locations?row='+RACKROW);RACKROW=d.row;
      await loadJs('/vendor/qrcode.js',()=>window.qrcode);
      B.innerHTML=`<div class="noprint chips">${d.rows.map(r=>`<button class="chip ${r===d.row?'on':''}" onclick="RACKROW='${r}';pgSetup()">${r}</button>`).join('')}</div>
        <div class="noprint btns" style="margin-bottom:12px"><button class="btn pri" onclick="window.print()">${L('พิมพ์','Print')} (${d.locations.length})</button></div>
        <div class="labels">${d.locations.map(l=>`<div class="lab">${qrSvg('LOC:'+l.code,22)}<div><div class="t">${esc(l.code)}</div><div class="u">${L('แถว','Row')} ${esc(l.row_code)} · ${L('ช่อง','Bay')} ${l.bay} · ${L('ชั้น','Lv')} ${l.level} · ${L('ตำแหน่ง','Pos')} ${l.slot}</div></div></div>`).join('')}</div>`;}
    else if(SETTAB==='users'){const d=await api('/api/wms/users');
      const RL={'':L('— ไม่มีสิทธิ์ —','— no access —'),view:L('ดูอย่างเดียว','View only'),qc:L('QC ตรวจรับ','QC inspector'),store:L('คลัง / รถยก','Store / forklift'),super:L('หัวหน้าคลัง','Supervisor')};
      B.innerHTML=`<div class="card"><div style="font-size:13px;color:var(--ink2);margin-bottom:10px">${L('ทีม FG = ผู้ที่มีสิทธิ์คลังสินค้า หลังเข้าสู่ระบบจะเห็นไอคอน CMMS และ คลังสินค้า ใช้บัญชีเดียวกับ CMMS ผู้ดูแลระบบเป็นหัวหน้าคลังเสมอ','FG team = anyone given Warehouse access. After sign-in they see both the CMMS and Warehouse app icons. Same accounts as the CMMS; CMMS admins are always Supervisor.')}</div>
       <div class="tw"><table><thead><tr><th>${L('ชื่อ','Name')}</th><th>${L('ผู้ใช้','Username')}</th><th>CMMS</th><th>${L('สิทธิ์คลังสินค้า','Warehouse access')}</th></tr></thead><tbody>
       ${d.users.map(u=>`<tr><td>${esc(u.name)}</td><td class="mono">${esc(u.username)}</td><td>${esc(u.role)}</td><td>${u.role==='admin'?RL.super:`<select class="in" style="max-width:200px" onchange="setRole(${u.id},this.value)">${['','view','qc','store','super'].map(r=>`<option value="${r}" ${u.wms_role===r?'selected':''}>${RL[r]}</option>`).join('')}</select>`}</td></tr>`).join('')}</tbody></table></div></div>`;}
  }catch(e){B.innerHTML=err(e);}
}
function qrSvg(text,mm){const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=2;let p='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c+m} ${r+m}h1v1h-1z`;
  return `<svg width="${mm}mm" height="${mm}mm" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`;}
async function saveProd(code,id){try{const r=await post('/api/wms/products',{code,shelf_life_days:+$('#sl-'+id).value||0});alert(L(`บันทึกแล้ว — อัปเดต EXP ${r.pallets_updated} พาเลท`,`Saved — EXP updated on ${r.pallets_updated} pallet(s)`));}catch(e){alert(e.message);}}
async function saveLayout(){const b={};['row_start','rows','bays','levels','slots','warn_days','crit_days'].forEach(k=>b[k]=$('#ly-'+k).value);
  try{const r=await post('/api/wms/settings',b);SET.warn_days=+b.warn_days;SET.crit_days=+b.crit_days;$('#lyRes').innerHTML=`<div class="msg m-ok">${L(`บันทึกแล้ว — ทั้งหมด ${r.total} ช่อง (เพิ่ม ${r.added}, ลบ ${r.removed})`,`Saved — ${r.total} slots (added ${r.added}, removed ${r.removed})`)}</div>`;}
  catch(e){$('#lyRes').innerHTML=err(e);}}
async function setRole(id,r){try{await post('/api/wms/users/'+id,{wms_role:r});}catch(e){alert(e.message);}}

/* ════════ Sign-in (same accounts and cookie as the CMMS) ════════ */
async function loginPage(){
  $('#side').innerHTML='';$('#bot').innerHTML='';
  let f=[];try{f=await api('/api/factories');}catch(e){}
  $('#app').innerHTML=`<div class="card" style="max-width:400px;margin:40px auto" ><h1>${L('เข้าสู่ระบบคลังสินค้า','Sign in to Warehouse')}</h1><div class="grid">
   <label class="f">${L('โรงงาน','Plant')}<select class="in" id="lgF">${f.map(x=>`<option value="${x.id}" ${x.code==='PC'?'selected':''}>${esc(x.code)}</option>`).join('')}</select></label>
   <label class="f">${L('ชื่อผู้ใช้','Username')}<input class="in" id="lgU" autocomplete="username"></label>
   <label class="f">${L('รหัสผ่าน','Password')}<input class="in" id="lgP" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></label>
   <div id="lgC"></div><div id="lgE"></div><button class="btn pri big" onclick="doLogin()">${L('เข้าสู่ระบบ','Sign in')}</button></div></div>`;
}
let CAP=null;
async function doLogin(){
  const b={username:$('#lgU').value,password:$('#lgP').value,factory_id:+$('#lgF').value};
  if(CAP){b.captcha_token=CAP;b.captcha_answer=($('#lgCa')||{}).value;}
  try{await post('/api/login',b);CAP=null;start();}
  catch(e){$('#lgE').innerHTML=err(e);
    if(e.detail&&e.detail.captcha_required){try{const c=await api('/api/captcha');CAP=c.token;$('#lgC').innerHTML=`<img src="${c.image}" alt="captcha"><input class="in" id="lgCa" placeholder="${L('รหัสจากภาพ','Code from the image')}">`;}catch(x){}}}
}

async function start(){
  $('#langBtn').textContent=TH()?'EN':'TH';
  try{ME=await api('/api/wms/me');}catch(e){if(e.status===401)return loginPage();$('#app').innerHTML=err(e);return;}
  $('#fac').textContent=ME.factory_code;$('#who').innerHTML=esc(ME.name)+'<br>'+esc({view:L('ดูอย่างเดียว','View'),qc:'QC',store:L('คลัง','Store'),super:L('หัวหน้าคลัง','Supervisor')}[ME.wms_role]||'');
  if(!ME.can.length){$('#app').innerHTML=`<div class="card" style="max-width:520px;margin:40px auto"><h1>${L('ยังไม่มีสิทธิ์ใช้คลังสินค้า','No warehouse access yet')}</h1><p>${L('ให้หัวหน้าคลังเปิดสิทธิ์ที่ ตั้งค่า › ผู้ใช้งาน','Ask the warehouse supervisor to give you access in Setup › Users.')}</p><button class="btn" onclick="location.href='/?apps=1'">Apps</button></div>`;return;}
  try{SET=(await api('/api/wms/summary')).settings;}catch(e){}
  buildNav();go((location.hash||'#home').slice(1),true);
}
window.addEventListener('hashchange',()=>{const p=(location.hash||'#home').slice(1);if(p!==PAGE&&ME)go(p,true);});
start();
</script>
